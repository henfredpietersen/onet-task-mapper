[project]
name = "onet-task-mapper"
version = "0.1.0"
description = "Map a job title or ad to O*NET occupations and tasks, with observed AI usage per task from the Anthropic Economic Index."
requires-python = ">=3.10"

[tool.ruff]
line-length = 135

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
